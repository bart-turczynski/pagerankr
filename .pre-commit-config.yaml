# The hygiene hooks, at commit and at push. Install with `pre-commit install`
# (both hook types, from default_install_hook_types below), then
# `.fleet-ci/pre-push --install`, which replaces pre-commit's pre-push hook
# with fleet-ci's: that hook runs the fleet-ci local gate (.fleet-ci/gate,
# settings in .fleet-ci.yml) on each pushed ref, then this file's pre-push
# stage. The gate itself (spelling, the NEWS heading, codemeta, docs drift,
# lintr, README drift, the URL check and R CMD check) is in .fleet-ci.yml,
# never here: this file must not run .fleet-ci/gate (fleet-ci README, "The
# local gate"). It replaces the former `verify` hook, .githooks/pre-push.
#
# Over fleet-ci's hook, `pre-commit install` and
# `pre-commit install --hook-type pre-push` without -f move it to
# hooks/pre-push.legacy (pre-commit's migration mode), which still runs the
# gate first. `pre-commit install -f` (both types, from
# default_install_hook_types) and `pre-commit install -f --hook-type pre-push`
# delete it and drop the gate; `-f --hook-type pre-commit` leaves it alone.
# Re-run `.fleet-ci/pre-push --install` after either of the two.
default_install_hook_types: [pre-commit, pre-push]
#
# air (the R formatter) is intentionally NOT wired up here: this package has no
# air.toml, so enabling it would reformat the whole source tree in one churny
# pass. Same call punycoder and rurl made.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # inst/extdata/reviews-microsite-{before,after}/*.csv are a deterministic,
      # scrub-gated case-study fixture (see inst/extdata/README.md):
      # data-raw/build-fixture.R states "the same source reproduces this
      # fixture exactly". A whitespace/EOF fixer edit would make the checked-in
      # bytes diverge from that regeneration guarantee even though no test
      # byte-compares them.
      #
      # tests/testthat/fixtures/screaming-frog/*-bom.csv are verbatim Screaming
      # Frog export fixtures (note the BOM in the filename -- they exist
      # specifically to exercise BOM/encoding handling), so their bytes are the
      # fixture.
      #
      # tests/testthat/_snaps/ is testthat-owned: it rewrites those files on
      # every test run (passing runs included) and its writer ends each file
      # with a blank line that end-of-file-fixer would strip, which would make
      # the committed form one the suite can never reproduce. Empty today, but
      # the failure mode is immediate the moment a snapshot test is added, so
      # it is excluded now rather than after the fact.
      #
      # .fleet-ci/ is fleet-ci's bin/vendor output, which seor's fleet checker
      # requires byte for byte; re-run bin/vendor rather than editing it.
      - id: end-of-file-fixer
        exclude: &fixer-excludes '^(\.fleet-ci/|inst/extdata/|tests/testthat/fixtures/|tests/testthat/_snaps/)'
      - id: trailing-whitespace
        exclude: *fixer-excludes
      - id: check-merge-conflict
      # Every YAML file but .gitlab-ci.yml through PyYAML's safe loader.
      - id: check-yaml
        exclude: ^\.gitlab-ci\.yml$
      # .gitlab-ci.yml with --unsafe: syntax only. Its x-* jobs use GitLab's
      # `!reference` tag, which the safe loader cannot construct. GitLab's CI
      # lint API and fleet-ci's bin/rules-sim read that file in full.
      - id: check-yaml
        name: check yaml (.gitlab-ci.yml, syntax only)
        args: [--unsafe]
        files: ^\.gitlab-ci\.yml$
      - id: check-toml
      - id: mixed-line-ending
        exclude: *fixer-excludes
      - id: check-case-conflict
  # British spellings in code, comments, string literals and tooling, which
  # spelling::spell_check_package() (the fleet-ci gate's docs gate) never
  # reads: it covers DESCRIPTION, roxygen, vignettes, README and NEWS only,
  # and that gap let British runtime messages ship (SEOR-xtmnpmae). Only the
  # en-GB_to_en-US dictionary is enabled, so this is not a general typo
  # checker. codespell skips dotfiles unless given --check-hidden, so
  # .bestpractices.json is skipped either way; it is listed so the intent
  # survives a flag change.
  # Excluded: .fleet-ci/ (fleet-ci's bin/vendor output), man/ (roxygen
  # output; fix the roxygen source), the Screaming Frog case-study exports
  # under inst/extdata/ (upstream values such as the "Canonicalised"
  # Indexability Status; the hand-written inst/extdata/README.md stays
  # checked), the Screaming Frog test fixtures, and .bestpractices.json
  # (mirrors the live bestpractices.dev entry). The British alias identifiers
  # (analyse_pagerank_grid, sf_normalise_position) need no allow-list: the
  # default tokenizer keeps underscores inside a word, so it never sees
  # "analyse" or "normalise" on its own there.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(\.fleet-ci/|man/|inst/extdata/(?!README\.md$)|tests/testthat/fixtures/|\.bestpractices\.json$)'
  - repo: local
    hooks:
      # Refuses the push when this clone's pre-push hook is not fleet-ci's,
      # so the push would run without the gate (SEOR-gksaxuoz). It only
      # reads the hook file; it never runs .fleet-ci/gate.
      - id: fleet-ci-hook-installed
        name: fleet-ci pre-push hook is installed
        entry: sh scripts/check-fleet-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # This machine's R toolchain against what the package pins: roxygen2
      # against Config/roxygen2/version, installed packages built under a newer
      # R, and the local pandoc against the fleet image's (.fleet-ci/toolchain),
      # so a local devtools::document() or a README knit writes what the gate
      # accepts. The gate itself runs in the fleet image and does not depend
      # on this machine's library. Quick: one request, for CRAN's package
      # index (SEOR-hxxxkmws, SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # CITATION.cff `version:` and .zenodo.json `"version"` must name the
      # release DESCRIPTION's Version names (X.Y.Z.9000 -> X.Y.Z), and every
      # URL they declare must also appear in DESCRIPTION's URL: field. Ported
      # from seor's scripts/check-citation.py (seor design/adr/0001). It runs
      # on every push, whatever the gate's tier; T2's citation-version job runs
      # it again. Its self-test runs when the script changes.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-citation-self-test
        name: check-citation self-test
        entry: python3 scripts/check-citation.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-citation\.py$
        stages: [pre-push]
      # DESCRIPTION's BugReports:, the roxygen-generated man/pagerankr-package.Rd
      # and every tracker link (codemeta.json, .bestpractices.json,
      # CONTRIBUTING.md, SECURITY.md, README.Rmd, README.md) name /-/work_items,
      # and no human-facing file carries a /-/issues link (seor ADR 0011,
      # https://gitlab.com/bart-turczynski/seor/-/blob/main/design/adr/0011-bugreports-names-work-items.md).
      # It reads _pkgdown.yml too, so it runs on every push, whatever the
      # gate's tier. Its self-test runs when the script changes.
      - id: check-bugreports
        name: BugReports and tracker links name /-/work_items
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-bugreports-self-test
        name: check-bugreports self-test
        entry: python3 scripts/check-bugreports.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-bugreports\.py$
        stages: [pre-push]
      # NEWS.md bullets are one terse line each (seor's fleet standard,
      # "NEWS.md bullets"). Ported verbatim from seor's scripts/check-news.py;
      # it takes milliseconds. Its self-test runs when the script changes.
      - id: news-terse
        name: NEWS.md bullets are one terse line
        entry: python3 scripts/check-news.py NEWS.md
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: news-terse-self-test
        name: check-news self-test
        entry: python3 scripts/check-news.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-news\.py$
        stages: [pre-push]
      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]
