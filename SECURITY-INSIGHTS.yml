header:
  schema-version: 2.2.0
  last-updated: '2026-09-24'
  last-reviewed: '2026-09-24'
  url: https://gitlab.com/bart-turczynski/pagerankr/-/raw/main/SECURITY-INSIGHTS.yml
  comment: |
    OpenSSF Security Insights self-report for pagerankr. This machine-readable
    report accompanies SECURITY.md and .bestpractices.json.

project:
  name: pagerankr
  homepage: https://bart-turczynski.gitlab.io/pagerankr/
  administrators:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      social: https://orcid.org/0000-0002-8788-7980
      primary: true
  documentation:
    quickstart-guide: https://bart-turczynski.gitlab.io/pagerankr/
    detailed-guide: https://bart-turczynski.gitlab.io/pagerankr/reference/index.html
    release-process: https://gitlab.com/bart-turczynski/pagerankr/-/blob/main/CONTRIBUTING.md
  repositories:
    - name: pagerankr
      url: https://gitlab.com/bart-turczynski/pagerankr
      comment: |
        Canonical repository and issue tracker for the pagerankr R package.
        GitHub carries a read-only mirror with issues and Actions turned off.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
    policy: https://gitlab.com/bart-turczynski/pagerankr/-/blob/main/SECURITY.md
    in-scope:
      - Unsafe handling of untrusted URL, redirect, link-graph, crawl, or analytics input.
      - Resource exhaustion, unexpected code execution, or information disclosure caused by those inputs.
    out-of-scope:
      - Vulnerabilities in dependencies; report those to the relevant upstream project.
    comment: |
      Do not use public issues for security reports. Email the maintainer
      (preferred; put "pagerankr security" in the subject), or open a GitLab
      confidential issue, which only project members can see. Reports are
      targeted for acknowledgment within 7 days.

repository:
  url: https://gitlab.com/bart-turczynski/pagerankr
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: false
  no-third-party-packages: false
  core-team:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      social: https://orcid.org/0000-0002-8788-7980
      primary: true
  documentation:
    contributing-guide: https://gitlab.com/bart-turczynski/pagerankr/-/blob/main/CONTRIBUTING.md
    security-policy: https://gitlab.com/bart-turczynski/pagerankr/-/blob/main/SECURITY.md
  license:
    url: https://gitlab.com/bart-turczynski/pagerankr/-/blob/main/LICENSE
    expression: MIT
  release:
    changelog: https://gitlab.com/bart-turczynski/pagerankr/-/blob/main/NEWS.md
    automated-pipeline: false
    distribution-points:
      - uri: https://gitlab.com/bart-turczynski/pagerankr
        comment: |
          Source installs from GitLab (devtools::install_gitlab()). No release is
          tagged yet; 0.1.0 has been submitted to CRAN.
      - uri: https://bart-turczynski.r-universe.dev
        comment: Development builds through r-universe.
  security:
    assessments:
      self:
        evidence: https://gitlab.com/bart-turczynski/pagerankr/-/blob/main/.bestpractices.json
        date: '2026-07-10'
        comment: OpenSSF Best Practices self-assessment, tracked in the repository.
    champions:
      - name: Bart Turczynski
        email: bartek@turczynski.pl
        primary: true
    tools:
      - name: lintr
        type: SAST
        rulesets:
          - project configuration
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          Full-package linting runs in the GitLab CI `gates` job on every pipeline
          (each push to main, and tags) and in the pre-push hook.
      - name: R CMD check
        type: other
        rulesets:
          - CRAN checks
        integration:
          adhoc: true
          ci: true
          release: true
        results: {}
        comment: |
          The GitLab CI `check` job runs R CMD check on Linux with R 4.6;
          `check-oldrel` runs it with R 4.5 on v* tags and on the deep-check
          schedule. The pre-push hook runs --as-cran. There is no macOS or
          Windows CI; see the header of .gitlab-ci.yml.
      - name: rosv (OSV)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          Audit of the runtime dependency closure against the OSV database
          (osv.dev). No account or secrets required. Runs as the `osv-audit` job
          in .gitlab-ci.yml on a pipeline schedule that sets
          SCHEDULE_KIND=dependency-audit, or by hand.
      - name: oysteR (Sonatype OSS Index)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          Audit of the hard dependencies (Depends + Imports) against the Sonatype
          OSS Index. Runs as the `security-audit` job in .gitlab-ci.yml on a
          pipeline schedule that sets SCHEDULE_KIND=dependency-audit, or by
          hand; needs the OSSINDEX_USER / OSSINDEX_TOKEN CI/CD variables and
          fails without them.
