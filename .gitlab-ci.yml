# GitLab CI for pagerankr: fleet-ci's template, pinned by commit SHA (seor
# ADR 0012, fleet-ci README "The CI template"). The template owns the event
# table, the jobs and the images; this file sets only the package's switches
# and settings, and adds pagerankr's two rurl jobs. A push to main or a
# branch, and a merge request, create no pipeline: the merge gate is the
# local one (.fleet-ci/gate, run by the .fleet-ci/pre-push hook; settings in
# .fleet-ci.yml). T2 runs on the deep-check schedule (SCHEDULE_KIND=deep-check,
# schedule 4467476), T3 on a RELEASE=1 web pipeline and a v* tag. The
# rurl-devel schedule (SCHEDULE_KIND=rurl-devel, 4466631) runs x-rurl-devel
# and coverage, pagerankr's one schedule exception. The dependency-audit
# schedule (4467475) gets no pipeline: osv-audit and security-audit run in
# T2. design/ci.md says what moved where.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 864e5386511de38b0dff594ba3118a800f662cc7
    file: templates/r-package.yml

variables:
  # pagerankr has no compiled code (no src/), and never had a sanitizer leg.
  FLEET_SANITIZERS: "false"
  # The declared floor, `Depends: R (>= 4.1.0)`: 4.1 is the oldest minor with
  # an arm64 rocker/r-ver image, which the runner needs. The snapshot must
  # serve `Imports: rurl (>= 3.0.1)` (on CRAN 2026-09-09) and the punycoder
  # and pslr releases rurl needs, so it is fleet-ci's own p3m date. Its Ubuntu
  # 20.04 binary path spares source builds on rocker/r-ver:4.1.3. Unproven
  # until the first T2 run: design/ci.md, "Gaps accepted".
  FLEET_FLOOR_R: "4.1.3"
  FLEET_FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/__linux__/focal/2026-10-28"

# The rurl lower bound DESCRIPTION declares, installed exactly and the suite
# run against it (PAGE-tsbkxhoz). A floor is a number someone reasoned to,
# and nothing else installs it: that is how `rurl (>= 2.1.0)` survived while
# no 2.1.0 existed, and `>= 3.0.0` after it (rurl went 1.2.0 to 3.0.1 on
# CRAN). The floor is read from DESCRIPTION and must be a version CRAN has
# published, current or archived; it goes into a job-local library prepended
# for the test run only, so the run library keeps the rurl users get. The
# suite runs through testthat::test_local(), as before, and the job sets no
# NOT_CRAN of its own. It ran on every push to main; it now runs in every T2
# and T3 pipeline (seor ADR 0012), the RELEASE=1 pre-submission run among
# them. design/ci.md, "The rurl floor job".
x-rurl-floor:
  extends: .t2-job
  image: $FLEET_RELEASE_IMAGE
  variables:
    RURL_FLOOR_LIB: "/tmp/rurl-floor-lib"
  before_script:
    - !reference [.fleet-r, before_script]
  script:
    - |
      fleet-tools Rscript -e '
      d <- read.dcf("DESCRIPTION")
      imports <- trimws(strsplit(d[1L, "Imports"], ",")[[1L]])
      hit <- grep("^rurl\\b", imports, value = TRUE)
      if (length(hit) != 1L) stop("Expected exactly one `rurl` entry in Imports, found ", length(hit), ".", call. = FALSE)
      floor <- sub("^rurl[[:space:]]*\\([[:space:]]*>=[[:space:]]*([^)[:space:]]+)[[:space:]]*\\)$", "\\1", hit)
      if (identical(floor, hit)) stop("`rurl` is declared in Imports without a `(>= x.y.z)` floor: ", hit, call. = FALSE)
      if ("Remotes" %in% colnames(d)) stop("DESCRIPTION carries a `Remotes:` field again. CRAN does not honor it, and this job resolves the floor from CRAN.", call. = FALSE)
      # CRAN itself, not the image p3m front-end: the claim checked is that
      # CRAN published this version, current or archived.
      repo <- "https://cloud.r-project.org"
      db <- utils::available.packages(repos = repo)
      current <- if ("rurl" %in% rownames(db)) db["rurl", "Version"] else character(0)
      con <- gzcon(url(file.path(repo, "src/contrib/Meta/archive.rds"), open = "rb"))
      archive <- readRDS(con)
      close(con)
      archived <- if ("rurl" %in% names(archive)) sub("^.*/rurl_(.*)[.]tar[.]gz$", "\\1", rownames(archive[["rurl"]])) else character(0)
      if (!floor %in% c(current, archived)) stop(sprintf("DESCRIPTION declares a rurl floor of %s, but CRAN has never published it. CRAN carries: %s.", floor, paste(sort(c(current, archived)), collapse = ", ")), call. = FALSE)
      lib <- Sys.getenv("RURL_FLOOR_LIB")
      dir.create(lib, recursive = TRUE, showWarnings = FALSE)
      p <- tempfile("pak-only-"); dir.create(p)
      file.symlink("/opt/fleet-tools/library/pak", file.path(p, "pak"))
      .libPaths(c(lib, Sys.getenv("FLEET_RUN_LIB"), p))
      pak::pkg_install(paste0("rurl@", floor), lib = lib, dependencies = FALSE, upgrade = FALSE)
      installed <- as.character(utils::packageVersion("rurl", lib.loc = lib))
      if (!identical(installed, floor)) stop(sprintf("Installed rurl %s, but DESCRIPTION declares the floor as %s.", installed, floor), call. = FALSE)
      writeLines(floor, "/tmp/rurl-floor")
      cat(sprintf("DESCRIPTION declares rurl (>= %s); CRAN has published it. Testing against %s.\n", floor, floor))'
    - |
      fleet-tools Rscript -e '
      .libPaths(c(Sys.getenv("RURL_FLOOR_LIB"), Sys.getenv("FLEET_RUN_LIB"), .libPaths()))
      in_use <- as.character(utils::packageVersion("rurl"))
      floor <- readLines("/tmp/rurl-floor")
      if (!identical(in_use, floor)) stop(sprintf("Suite would run against rurl %s, not the declared floor %s.", in_use, floor), call. = FALSE)
      cat("Running the suite against rurl", in_use, "\n")
      testthat::test_local(".", stop_on_failure = TRUE)'

# The suite against rurl's development `main` (PAGE-majaowtn): the
# upstream-commit coverage `Remotes:` used to give every job, restored as one
# job on the rurl-devel schedule (SCHEDULE_KIND=rurl-devel, schedule 4466631),
# which the template pairs with `coverage`, so the badge stays current. rurl
# goes into a job-local library prepended for the test run only. It reports on
# upstream, so it never fails the pipeline (allow_failure). RURL_DEVEL_REF, a
# schedule variable, points it at another rurl branch or commit. design/ci.md,
# "The rurl development job".
x-rurl-devel:
  extends: .schedule-job
  image: $FLEET_RELEASE_IMAGE
  allow_failure: true
  variables:
    FLEET_JOB_SCHEDULE: "rurl-devel"
    RURL_DEVEL_LIB: "/tmp/rurl-devel-lib"
    RURL_DEVEL_REF: "main"
  before_script:
    - !reference [.fleet-r, before_script]
  script:
    - |
      fleet-tools Rscript -e '
      lib <- Sys.getenv("RURL_DEVEL_LIB")
      dir.create(lib, recursive = TRUE, showWarnings = FALSE)
      p <- tempfile("pak-only-"); dir.create(p)
      file.symlink("/opt/fleet-tools/library/pak", file.path(p, "pak"))
      .libPaths(c(lib, Sys.getenv("FLEET_RUN_LIB"), p))
      ref <- Sys.getenv("RURL_DEVEL_REF")
      pak::pkg_install(paste0("gitlab::bart-turczynski/rurl@", ref), lib = lib, dependencies = NA, upgrade = FALSE)
      sha <- utils::packageDescription("rurl", lib.loc = lib)$RemoteSha
      if (is.null(sha)) stop("rurl in ", lib, " carries no RemoteSha; it did not come from GitLab.", call. = FALSE)
      writeLines(sha, "/tmp/rurl-devel-sha")
      cat(sprintf("Installed rurl %s from GitLab %s at %s\n", as.character(utils::packageVersion("rurl", lib.loc = lib)), ref, sha))'
    - |
      fleet-tools Rscript -e '
      .libPaths(c(Sys.getenv("RURL_DEVEL_LIB"), Sys.getenv("FLEET_RUN_LIB"), .libPaths()))
      sha <- utils::packageDescription("rurl")$RemoteSha
      want <- readLines("/tmp/rurl-devel-sha")
      if (!identical(sha, want)) stop("Suite would run against a rurl other than the GitLab install at ", want, ".", call. = FALSE)
      cat("Running the suite against rurl", as.character(utils::packageVersion("rurl")), "at", sha, "\n")
      testthat::test_local(".", stop_on_failure = TRUE)'
