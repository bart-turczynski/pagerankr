# Remote verification gate, on the forge this project actually lives on.
#
# The nine `.github/workflows/` files target a suspended account and have not
# run since 2026-08-07 (PAGE-nsvpurra). Between that date and this file, the
# only gate was `.githooks/pre-push` — one platform, locally, and only in a
# clone where `git config core.hooksPath .githooks` had been run. This restores
# a remote gate.
#
# Scope is deliberately smaller than the GitHub set. There is no `r-lib/actions`
# equivalent for GitLab CI, so every job here is hand-rolled on a rocker image
# rather than mechanically translated.
#
# Ported: the four-check gate (news-version, lint, spelling, R CMD check), the
# rurl floor, the docs site, coverage, the OSV audit, a codemeta consistency
# check, and the R-oldrel slice of the matrix.
#
# NOT ported, because they cannot be (PAGE-ppmceqnr) — recorded here so their
# absence reads as a decision rather than as neglect:
#
#   macOS / Windows checks  No runner exists. The runner is self-hosted Docker
#                           on one Mac, so Linux containers only. Shared
#                           runners are not an alternative today because the
#                           namespace's Free-plan CI quota is exhausted
#                           (406/400 minutes, measured 2026-09-23) -- a
#                           consumption fact, not a plan-tier restriction, and
#                           one self-hosted minutes never counted against
#                           anyway (design/adr/0003, seor repo).
#   R-hub                   R-hub v2 works by dispatching workflows inside a
#                           GitHub repository. There is no GitLab equivalent to
#                           port; `rhub.yaml` is not translatable, only
#                           replaceable, and nothing here replaces it.
#   OSS Index audit         Needs OSSINDEX_USER / OSSINDEX_TOKEN as project
#                           variables, which only the owner can add. `osv-audit`
#                           below covers the same ground unauthenticated, and
#                           oysteR 0.1.4 hardcodes the legacy OSS Index endpoint
#                           that sunsets 2026-12-31.
#   R-devel check           `rocker/r-devel` publishes no arm64 variant, so it
#                           would run emulated on this host — the trap the
#                           `default.image` note below exists to warn about.
#                           win-builder and R-hub remain the route to R-devel.
#
# Codecov is not re-linked and is not wanted: `coverage` below reports through
# GitLab's own cobertura ingestion, so MR coverage diffs need no third-party
# account and no CODECOV_TOKEN.
#
#   Local mirror of the four checks:  .githooks/pre-push
#   What is and is not gated:         CONTRIBUTING.md, cran-comments.md

stages:
  - verify
  - check
  - deploy

default:
  # Pinned to a minor R series rather than `latest`, so an upstream R release
  # cannot turn this gate red on a day nothing in the package changed. Matches
  # the sibling pslr runner's default image.
  #
  # This tag is multi-arch. On the self-hosted arm64 runner, which architecture
  # actually runs is decided by whichever variant is already in the local image
  # cache, because `pull_policy = if-not-present` never re-resolves the
  # manifest — and gitlab-runner 19.2.1 exposes no way to pin the platform.
  # A stale amd64 copy therefore runs every job under emulation, silently and
  # without failing anything. Check with
  # `docker image inspect rocker/r-ver:4.6 --format '{{.Architecture}}'` and
  # correct with `docker pull --platform linux/arm64 rocker/r-ver:4.6`.
  #
  # This applies per TAG, not once per host: `check-oldrel` first ran emulated
  # on an amd64 `r-ver:4.5` even though 4.6 had already been corrected. Every
  # rocker tag added below needs the same one-off pull on the runner host.
  image: rocker/r-ver:4.6
  # rocker/r-ver points `install.packages()` at the Posit binary repo for this
  # image's Ubuntu release, so R packages arrive prebuilt. Without that, a cold
  # `check` job compiles the whole Suggests set from source.
  before_script:
    - mkdir -p "$R_LIBS_USER"
    # Add CRAN itself BEHIND the image's p3m repo.
    #
    # p3m lags CRAN by up to a day for a new release. Note this image is NOT
    # on a stale pin — measured from the images themselves, `r-ver:4.6` points
    # at p3m `latest` and only `r-ver:4.5` (check-oldrel) carries a date:
    #
    #     rocker/r-ver:4.6 -> https://p3m.dev/cran/__linux__/noble/latest
    #     rocker/r-ver:4.5 -> https://p3m.dev/cran/__linux__/noble/2026-04-23
    #
    # so the jobs that failed were already asking p3m for its newest state and
    # still could not see the release. The lag is p3m's, not a pin's.
    # Measured 2026-09-09, the day rurl 3.0.1 was published:
    #
    #     p3m snapshot 2026-09-01   rurl 1.2.0
    #     p3m snapshot 2026-09-09   rurl 1.2.0   <- same day, still behind
    #     p3m latest                rurl 1.2.0
    #     cloud.r-project.org       rurl 3.0.1
    #
    # so `Imports: rurl (>= 3.0.1)` was unresolvable from p3m at ANY coordinate,
    # and every dependency-resolving job died with "Can't install dependency
    # rurl (>= 3.0.1)". There is no date to bump to — `latest` was already the
    # setting; only a repo that carries the release can fix it.
    #
    # p3m stays FIRST so everything else still arrives as a prebuilt binary —
    # a cold `check` otherwise compiles the whole Suggests set from source.
    # CRAN is a source-only fallback for the handful of packages p3m has not
    # synced yet; `available.packages()` unions the two and takes the highest
    # version, so this changes nothing on any day p3m is current.
    #
    # Appended rather than rewritten, so rocker's HTTPUserAgent line — the one
    # that makes p3m serve binaries instead of source — survives, and the
    # later options() call wins.
    - |
      Rscript -e '
      current <- getOption("repos")[["CRAN"]]
      if (is.null(current) || !nzchar(current) || identical(current, "@CRAN@")) {
        stop("Expected a repo in Rprofile.site, found: ", current, call. = FALSE)
      }
      line <- sprintf("options(repos = c(P3M = %s, CRAN = %s))",
                      dQuote(current, FALSE),
                      dQuote("https://cloud.r-project.org", FALSE))
      cat(line, "\n", sep = "", file = file.path(R.home(), "etc", "Rprofile.site"),
          append = TRUE)'
    - Rscript -e 'cat("Effective repos:\n"); print(getOption("repos"))'
    - Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak")'
    # Self-evidencing check for the R_LIBS reasoning below (SEOR-dyzgzyot):
    # print .libPaths()[1] so a claim about cache ordering is verifiable from
    # every job's own log, not just from a comment. Verified once already —
    # live, with docker — via scripts/check-libpaths-order.py: the cache
    # directory already wins here, so this line is evidence, not a fix.
    - |
      Rscript -e '
      cat("Effective .libPaths():\n"); print(.libPaths())
      if (normalizePath(.libPaths()[1]) != normalizePath(Sys.getenv("R_LIBS_USER"))) {
        stop("Cache directory is not first in .libPaths(); the cache would ",
             "carry downloads but not the built library. See SEOR-dyzgzyot.",
             call. = FALSE)
      }'
  cache:
    # Keyed on DESCRIPTION: the library only needs rebuilding when the declared
    # dependencies move. Every dependency now resolves from CRAN, so a cache hit
    # can still hold an older rurl than CRAN currently serves — a new rurl
    # release does not touch DESCRIPTION and so does not rotate the key. That
    # was true before too (`Remotes:` tracked rurl main HEAD); what changed is
    # that the drift is now bounded by releases rather than by commits.
    # `rurl-floor` is unaffected: it installs into its own library, below.
    key:
      files:
        - DESCRIPTION
    paths:
      - .cache/R

variables:
  R_LIBS_USER: "$CI_PROJECT_DIR/.cache/R"
  # `R_LIBS_USER` alone does NOT make the cache work. rocker's Renviron.site
  # sets `R_LIBS=${R_LIBS-'…site-library:…library'}`, which puts the container's
  # own site library first in `.libPaths()` and leaves `.cache/R` third — so pak
  # installed into the container, `.cache/R` was archived EMPTY, and every job
  # re-downloaded the full dependency set while the log still cheerfully
  # reported "Successfully extracted cache". Measured before this line: 117
  # packages downloaded on a warm cache. Setting `R_LIBS` wins because that
  # Renviron.site default defers to an already-set value.
  #
  # Re-verified 2026-09-23 against a fleet-wide claim (SEOR-dyzgzyot) that
  # `R_LIBS_USER` alone is what every repo sets and that the fix is to append
  # `.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))` to Rprofile.site in
  # before_script. That claim does not describe this file: the explicit
  # `R_LIBS` below already existed and already wins, confirmed live —
  #
  #   docker run --rm -e R_LIBS_USER=/tmp/rlib rocker/r-ver:4.6 \
  #     Rscript -e '.libPaths()'
  #   [1] "/usr/local/lib/R/site-library" "/usr/local/lib/R/library"
  #
  #   docker run --rm -e R_LIBS=/tmp/rlib:/usr/local/lib/R/site-library:/usr/local/lib/R/library \
  #     rocker/r-ver:4.6 sh -c 'mkdir -p /tmp/rlib; Rscript -e ".libPaths()"'
  #   [1] "/tmp/rlib" "/usr/local/lib/R/site-library" "/usr/local/lib/R/library"
  #
  # — so pagerankr needs the Rprofile.site mechanism from nowhere; it would be
  # a second, redundant way to reach an ordering this file already reaches.
  # See scripts/check-libpaths-order.py, which pins this for both this job
  # and check-oldrel, and the `.libPaths()` print in before_script above.
  R_LIBS: "$CI_PROJECT_DIR/.cache/R:/usr/local/lib/R/site-library:/usr/local/lib/R/library"
  # pak resolves Ubuntu system requirements itself; the image runs as root, so
  # it can act on them. Saves hand-maintaining an apt list per job.
  PKG_SYSREQS: "true"
  GIT_DEPTH: "0"

# One pipeline per merge, on main — not three.
#
# This used to suppress only the branch pipeline when its branch had an open
# MR, leaving branch + MR + main to run for ordinary work and MR + main for a
# branch with an open MR. On this fleet's self-hosted runners (pagerankr's
# own included; `concurrent = 4` in `~/.gitlab-runner/config.toml` on the
# host this project's owner controls, not a GitLab-imposed cap -- a dedicated
# runner does not fix this either way, since the collision is a queue-
# ordering problem within one project, not a capacity shortage) the branch
# and MR pipelines are CREATED FIRST, before the one on main, and they test
# the same tree main is about to test again.
# Worse, they can outlive what they were testing: a branch pipeline can still
# be fetching sources after its branch is deleted at merge, and an MR
# pipeline for an already-merged, already-deleted-branch MR has been observed
# holding a runner's only slot for over half an hour while the main pipeline
# that actually gates the work sat pending behind it. Measured repeatedly
# across the fleet; see SEOR-bmgkzhvy.
#
# So: no branch pipelines, no MR pipelines, ever. Only main, tags, and a
# pipeline a human starts by hand.
#
# The cost is real and deliberate, not an oversight: you lose the ability to
# see a CI result before clicking merge, and a feature-branch *push* now gets
# NO CI at all, as does an API-triggered pipeline on a non-default branch.
# The hand-started ("web") pipeline is the exception, and it is what keeps
# that cost bearable: it runs the full gate against whatever ref you pick, so
# a branch can still be verified on the server before it merges. It cannot
# fire on its own — someone has to open Build > Pipelines > Run pipeline — so
# it does not reintroduce the pile-up above, which was push- and
# merge-request-driven. `pages` is pinned to the default branch and is not
# reachable that way.
# Both cost nothing here in practice: `only_allow_merge_if_pipeline_succeeds`
# is false on this project (verified against `protected_branches` /
# `projects` API, not assumed), so a pipeline result has never gated a merge
# — main is protected by role (Maintainer push/merge), not by CI status — and
# `.githooks/pre-push` runs the same checks locally before the push ever
# happens. What it does cost: GitLab's per-line coverage annotation in an MR
# diff (see `coverage` below) needs a pipeline associated with the MR, and
# none runs now — see CONTRIBUTING.md.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

# 1. NEWS / DESCRIPTION version consistency.
#
# The top NEWS.md heading must be either "(development version)" or exactly the
# DESCRIPTION Version. Catches a stale "(development version)" heading left in
# place at release time. A checkout plus two greps — no R, so it runs on a
# minimal image and finishes in seconds.
news-version:
  stage: verify
  image: alpine:latest
  cache: []
  before_script: []
  script:
    - |
      set -eu
      version="$(grep -E '^Version:' DESCRIPTION | head -n1 | sed -E 's/^Version:[[:space:]]*//')"
      heading="$(grep -m1 -E '^# ' NEWS.md | sed -E 's/^#[[:space:]]+pagerankr[[:space:]]*//')"
      echo "DESCRIPTION Version : '$version'"
      echo "Top NEWS heading    : '$heading'"
      if [ "$heading" = "(development version)" ] || [ "$heading" = "$version" ]; then
        echo "OK: NEWS heading and version are consistent."
      else
        echo "Top NEWS.md heading ('$heading') is neither '(development version)'"
        echo "nor the DESCRIPTION Version ('$version'). Update NEWS.md before release."
        exit 1
      fi

# codemeta.json consistency.
#
# The GitHub `codemeta.yaml` REGENERATED codemeta.json with codemetar and
# committed the result unreviewed. That job is deliberately not ported, because
# regeneration is what damages this file: codemetar 0.3.7 builds a
# `host::`-prefixed Remotes spec's `sameAs` by prepending https://github.com/ to
# the raw string, emitting https://github.com/gitlab::bart-turczynski/rurl —
# wrong host, literal `::` in the path (PAGE-bpwkoofa) — and a local
# regeneration also silently drops readme, releaseNotes and keywords. So
# codemeta.json is maintained by hand, and this job checks the two properties
# the generator was there to keep true, without touching the file.
#
# Same shape as news-version: a checkout and some greps, no R.
codemeta:
  stage: verify
  image: alpine:latest
  cache: []
  before_script: []
  script:
    - |
      set -eu
      version="$(grep -E '^Version:' DESCRIPTION | head -n1 | sed -E 's/^Version:[[:space:]]*//')"
      # Anchored to exactly two spaces of indent so this reads the TOP-LEVEL
      # version, not the `"version"` inside each of the ~20 nested dependency
      # objects. If the file is ever reshaped, the count check below fails
      # loudly rather than silently comparing against the wrong line.
      hits="$(grep -c '^  "version":' codemeta.json || true)"
      if [ "$hits" != "1" ]; then
        echo "Expected exactly one top-level '\"version\":' line in codemeta.json, found $hits."
        echo "The file's shape changed; this check needs updating before it can be trusted."
        exit 1
      fi
      declared="$(grep '^  "version":' codemeta.json | sed -E 's/.*"version":[[:space:]]*"([^"]*)".*/\1/')"
      echo "DESCRIPTION Version : '$version'"
      echo "codemeta.json version: '$declared'"
      if [ "$version" != "$declared" ]; then
        echo "codemeta.json is stale. Hand-edit its version to '$version' — do NOT run"
        echo "codemetar::write_codemeta(), which drops readme/releaseNotes/keywords."
        exit 1
      fi
      # Catches the codemetar mangling directly, whatever produced it: a remote
      # spec left inside a URL. Nothing legitimate in this file has `::` after a
      # scheme.
      if grep -nE 'https?://[^"]*::' codemeta.json; then
        echo "codemeta.json carries a remote spec inside a URL (see the lines above)."
        exit 1
      fi
      echo "OK: codemeta.json is consistent with DESCRIPTION and carries no mangled URLs."

# CITATION.cff / .zenodo.json version consistency.
#
# Ported verbatim from seor's scripts/check-citation.py (design/adr/0001 there):
# CITATION.cff's `version:` and .zenodo.json's `"version"` must name the
# release DESCRIPTION's Version points at (X.Y.Z -> X.Y.Z; X.Y.Z.9000 ->
# X.Y.Z), plus every URL those two files declare must also appear in
# DESCRIPTION's URL field. pagerankr is conformant today; this job exists so
# it stays that way. Offline and stdlib-only, so no R image needed — same
# shape as news-version and codemeta above.
citation-version:
  stage: verify
  image: python:3.13-alpine
  cache: []
  before_script: []
  script:
    - python3 scripts/check-citation.py --self-test
    - python3 scripts/check-citation.py

# 2 + 3. Lint and spelling.
#
# Spelling guards DESCRIPTION `Language: en-US` across Rd, vignettes, README and
# NEWS. It exists because prose drifted in unnoticed after the WORDLIST was
# built: the case-study vignette introduced two en-GB spellings and two
# untracked terms, and nothing caught them (PAGE-xevimisi). Fix real
# misspellings in the text; add genuine terms to inst/WORDLIST.
lint:
  stage: verify
  variables:
    LINTR_ERROR_ON_LINT: "true"
  script:
    - Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pkg_install(c("lintr", "spelling"))'
    - Rscript -e 'l <- lintr::lint_package(); if (length(l)) { print(l); quit(status = 1L) }'
    - |
      Rscript -e '
      bad <- spelling::spell_check_package()
      if (nrow(bad)) {
        print(bad)
        stop("Spelling errors found. Correct the prose, or add genuine terms to inst/WORDLIST (see `spelling::update_wordlist()`).", call. = FALSE)
      }'

# 4. R CMD check.
#
# This is what catches correctness regressions — e.g. a dependency bump that
# turns fixtures red (rurl 2.1.0 emptied bare-label graphs and slipped in while
# remote CI was billing-disabled). Fails on errors AND warnings.
#
# A standard check, matching the GitHub `Verify` job it replaces; the strict
# `--as-cran` pass is what `.githooks/pre-push` runs locally, and what the
# unported release-time matrix used to run.
check:
  stage: check
  needs: [lint]
  variables:
    R_KEEP_PKG_SOURCE: "yes"
  script:
    # pandoc builds the vignettes; qpdf and ghostscript arm the tarball and PDF
    # size checks that R CMD check otherwise silently SKIPS.
    - apt-get update -qq && apt-get install -y --no-install-recommends pandoc qpdf ghostscript
    - Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pkg_install("rcmdcheck")'
    # `check_dir` is set so the check output lands inside the project directory.
    # Without it rcmdcheck works in a temp dir, and the failure artifact below
    # silently uploads nothing ("no matching files") — exactly when the logs are
    # wanted most.
    - |
      Rscript -e '
      rcmdcheck::rcmdcheck(
        args = "--no-manual",
        build_args = c("--no-manual", "--compact-vignettes=gs+qpdf"),
        error_on = "warning",
        check_dir = "check"
      )'
  artifacts:
    when: on_failure
    paths:
      - check/
    expire_in: 1 week

# Test coverage.
#
# This was a job inside the GitHub `verify.yml`, not a workflow of its own, and
# it reported to Codecov. It reports to GitLab instead: `coverage_format:
# cobertura` is what WOULD drive per-line coverage annotations in a merge
# request diff, and the `coverage:` regex below drives the project percentage
# and its badge. The annotation half needs a pipeline associated with the MR to
# attach the report to, and the top-level `workflow:` block creates none — see
# CONTRIBUTING.md — so today this only ever runs on `main`, after the merge,
# and the diff annotation never appears. Kept anyway: the badge and the
# artifact are still useful, and it costs nothing to leave cobertura wired up
# for the day an MR pipeline exists again. That removes a third-party account
# and a CODECOV_TOKEN from the critical path rather than re-linking the
# existing `/gh/` Codecov project under `/gl/`.
#
# Not a gate: coverage that FAILS a pipeline turns every honest refactor into a
# fight with a number. `allow_failure` keeps a covr crash visible without
# blocking a merge.
coverage:
  stage: check
  needs: [check]
  allow_failure: true
  script:
    - Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pkg_install(c("covr", "xml2"))'
    # `type = "tests"` matches what the GitHub job measured via the covr
    # default; stated explicitly so a covr default change cannot move the number
    # without anyone editing this file.
    - |
      Rscript -e '
      cov <- covr::package_coverage(type = "tests", quiet = FALSE)
      covr::to_cobertura(cov)
      cat(sprintf("Coverage: %.2f%%\n", covr::percent_coverage(cov)))'
  coverage: '/^Coverage: ([0-9.]+)%$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
    expire_in: 1 week

# Dependency vulnerability audit against the OSV database (https://osv.dev).
#
# Runs tests/testthat/test-osv.R, which resolves pagerankr's RUNTIME dependency
# closure at installed versions and queries each one. No account and no token,
# unlike the OSS Index audit this supersedes.
#
# Scheduled, because that is what a vulnerability audit is for: the dependency
# set can stop being safe on a day nothing in this repo changed. No schedule is
# configured today (`pipeline_schedules` is empty) — this rule is ready for one,
# and a schedule would need to target `main` to produce a pipeline at all, per
# the top-level `workflow:` block. On the default branch it additionally runs
# when the inputs move, and it is available manually on any pipeline that DOES
# get created (a `main` push or a `v*` tag — no branch or MR pipeline exists to
# trigger it from before merging).
osv-audit:
  stage: verify
  needs: []
  variables:
    # test-osv.R calls skip_on_cran(), and testthat::test_local() does not set
    # NOT_CRAN. Without this the audit skips and the job goes green having
    # queried nothing.
    NOT_CRAN: "true"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - DESCRIPTION
        - tests/testthat/test-osv.R
        - .gitlab-ci.yml
    - when: manual
      allow_failure: true
  script:
    - Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pkg_install(c("rosv", "testthat"))'
    # pagerankr must be INSTALLED, and this is the second job to need saying so
    # (see `pages`). The test resolves its closure through
    # `tools::package_dependencies("pagerankr", db = installed.packages())`,
    # which returns nothing for a package that is not installed — and the test
    # then skips on its own empty dependency set. The failure mode is a green
    # job that audited zero packages, so the count is asserted below.
    - Rscript -e 'pak::local_install(upgrade = FALSE)'
    - |
      Rscript -e '
      db <- utils::installed.packages()
      closure <- tools::package_dependencies("pagerankr", db = db,
                                             which = c("Depends", "Imports"),
                                             recursive = TRUE)[[1L]]
      if (!length(closure)) {
        stop("pagerankr resolves to an empty runtime closure; the audit would skip silently.",
             call. = FALSE)
      }
      cat("Auditing", length(closure), "runtime dependencies.\n")'
    - Rscript -e 'testthat::test_local(filter = "osv", stop_on_failure = TRUE)'

# R CMD check on the previous R minor release.
#
# The one slice of the GitHub cross-platform matrix that this runner can carry
# natively: `rocker/r-ver:4.5` publishes an arm64 variant, so it runs unemulated
# on this host, while `rocker/r-devel` is amd64-only and is therefore left to
# R-hub and win-builder (see the header).
#
# DESCRIPTION declares `R (>= 4.0.0)`. This does not prove that floor — one
# release back is not four — but it is the difference between testing one R
# version and testing more than one, which is where version-sensitive breakage
# actually shows up.
#
# Manual on branches, automatic on release tags: the cost is a full second check
# per run, and the moment it has to be right is a CRAN submission.
check-oldrel:
  stage: check
  needs: []
  image: rocker/r-ver:4.5
  variables:
    R_KEEP_PKG_SOURCE: "yes"
    # A SEPARATE library, and a separate cache key. An R package library is
    # tied to the R minor version that built it — dropping 4.5 builds into the
    # 4.6 cache would poison every other job with packages R 4.6 refuses to
    # load ("installed by an R version with different internals").
    R_LIBS_USER: "$CI_PROJECT_DIR/.cache/R-4.5"
    R_LIBS: "$CI_PROJECT_DIR/.cache/R-4.5:/usr/local/lib/R/site-library:/usr/local/lib/R/library"
  cache:
    key:
      prefix: r45
      files:
        - DESCRIPTION
    paths:
      - .cache/R-4.5
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - when: manual
      allow_failure: true
  before_script:
    # rocker pins `repos` to a FROZEN P3M snapshot in Rprofile.site — for
    # `r-ver:4.5`, 2026-04-23 — which is the right default for reproducibility
    # and the wrong one here. rurl imports punycoder and pslr, and the CRAN
    # releases satisfying its floors postdate that snapshot, so dependency
    # resolution fails outright:
    #
    #   * gitlab::bart-turczynski/rurl:
    #     * Can't install dependency punycoder (>= 1.2.0) (>= 1.1.0)
    #     * Can't install dependency pslr (>= 1.1.0)
    #   * punycoder: Can't find package called punycoder, pslr.
    #
    # Not a pak bug and not version-specific: pak 0.9.4 and 0.11.1 both fail on
    # the frozen snapshot and both succeed on `latest`. `r-ver:4.6` never hit it
    # because its snapshot is recent enough to carry both packages.
    #
    # A user .Rprofile is the override, because Rprofile.site hardcodes the URL
    # and reads no environment variable. Only the trailing date is replaced, so
    # the distro path travels with the image instead of being restated here, and
    # an unrecognised shape stops the job rather than silently leaving the pin in
    # place. Testing old R against CURRENT packages is also what CRAN does.
    #
    # CRAN is appended behind p3m for the same reason the default before_script
    # does it: p3m `latest` is NOT current — it lagged rurl 3.0.1 by more than a
    # day. `latest` alone would leave this job unable to resolve the declared
    # floor while every other job could. This file's user .Rprofile is read
    # AFTER Rprofile.site, so it must carry the fallback itself rather than
    # inherit it.
    - |
      Rscript -e '
      current <- getOption("repos")[["CRAN"]]
      if (!grepl("/[0-9]{4}-[0-9]{2}-[0-9]{2}$", current)) {
        stop("Expected a date-pinned P3M repo in Rprofile.site, found: ", current,
             "\nThe image changed shape; this override needs rewriting.", call. = FALSE)
      }
      latest <- sub("/[0-9]{4}-[0-9]{2}-[0-9]{2}$", "/latest", current)
      writeLines(sprintf("options(repos = c(P3M = %s, CRAN = %s))",
                         dQuote(latest, FALSE),
                         dQuote("https://cloud.r-project.org", FALSE)),
                 file.path(Sys.getenv("HOME"), ".Rprofile"))
      cat("Image pins:", current, "\n  overridden to:", latest,
          "\n  with CRAN appended as fallback\n")'
    - mkdir -p "$R_LIBS_USER"
    - Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak")'
    # Same self-evidencing check as the default job's before_script
    # (SEOR-dyzgzyot) — this job has its own R_LIBS_USER/R_LIBS pair
    # (.cache/R-4.5), so it is checked separately.
    - |
      Rscript -e '
      cat("Effective .libPaths():\n"); print(.libPaths())
      if (normalizePath(.libPaths()[1]) != normalizePath(Sys.getenv("R_LIBS_USER"))) {
        stop("Cache directory is not first in .libPaths(); the cache would ",
             "carry downloads but not the built library. See SEOR-dyzgzyot.",
             call. = FALSE)
      }'
  script:
    - Rscript -e 'cat("Effective repos:\n"); print(getOption("repos"))'
    - apt-get update -qq && apt-get install -y --no-install-recommends pandoc qpdf ghostscript
    - Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pkg_install("rcmdcheck")'
    - |
      Rscript -e '
      cat("Checking under R", as.character(getRversion()), "\n")
      rcmdcheck::rcmdcheck(
        args = "--no-manual",
        build_args = c("--no-manual", "--compact-vignettes=gs+qpdf"),
        error_on = "warning",
        check_dir = "check"
      )'
  artifacts:
    when: on_failure
    paths:
      - check/
    expire_in: 1 week

# Exercises the rurl lower bound that DESCRIPTION declares.
#
# The gap this closes: a floor is a number someone reasoned to, and nothing
# routinely installs it. That is how `rurl (>= 2.1.0)` survived while no v2.1.0
# existed at all, and how `>= 3.0.0` survived after it — rurl went 1.2.0 to
# 3.0.1 on CRAN and never released a 3.0.0 (PAGE-tsbkxhoz).
#
# It resolves the floor from CRAN, not from a forge tag. Until 2026-09-09 rurl
# was off CRAN and `Remotes:` named the source, so this job read the repo and
# its host out of that field and installed a git tag. `Remotes:` is gone now
# (rurl is on CRAN, and CRAN does not honor the field), so the version anyone
# can actually install is the one CRAN serves — current or archived. A tag that
# never became a release is not a floor a user can reach.
#
# It stays ADDITIVE and job-local: rurl at the floor goes into
# `.rurl-floor-lib`, prepended for the test step only, so the shared cache the
# other jobs use is untouched.
#
# It runs on every pipeline that exists (`rules: [{when: always}]`) — under the
# top-level `workflow:` block that means every push to `main` and every `v*`
# tag, since no branch or MR pipeline is created any more. It was manual while
# it could not pass; it can, so it gates.
rurl-floor:
  stage: check
  needs: []
  variables:
    RURL_FLOOR_LIB: "$CI_PROJECT_DIR/.rurl-floor-lib"
  rules:
    - when: always
  script:
    - Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pkg_install(c("remotes", "testthat", "pkgload"))'
    # Reads the floor out of DESCRIPTION rather than hardcoding it, so a bump
    # cannot leave this testing the old number.
    - |
      Rscript -e '
      d <- read.dcf("DESCRIPTION")
      imports <- trimws(strsplit(d[1L, "Imports"], ",")[[1L]])
      hit <- grep("^rurl\\b", imports, value = TRUE)
      if (length(hit) != 1L) {
        stop("Expected exactly one `rurl` entry in Imports, found ", length(hit), ".", call. = FALSE)
      }
      version <- sub("^rurl[[:space:]]*\\([[:space:]]*>=[[:space:]]*([^)[:space:]]+)[[:space:]]*\\)$", "\\1", hit)
      if (identical(version, hit)) {
        stop("`rurl` is declared in Imports without a `(>= x.y.z)` floor: ", hit, call. = FALSE)
      }
      if ("Remotes" %in% colnames(d)) {
        stop("DESCRIPTION carries a `Remotes:` field again. CRAN does not honor it, ",
             "and this job resolves the floor from CRAN.", call. = FALSE)
      }
      # Enumerated separately from the install so a floor naming a version CRAN
      # never served is reported as exactly that, rather than surfacing as an
      # opaque install error. The archive matters: a floor is usually a version
      # a newer release has already superseded.
      # CRAN itself, not whatever mirror or binary front-end the job resolves
      # through: the claim being checked is that CRAN published this version.
      repo <- "https://cloud.r-project.org"
      db <- utils::available.packages(repos = repo)
      current <- if ("rurl" %in% rownames(db)) db["rurl", "Version"] else character(0)
      con <- gzcon(url(file.path(repo, "src/contrib/Meta/archive.rds"), open = "rb"))
      archive <- readRDS(con)
      close(con)
      archived <- if ("rurl" %in% names(archive)) {
        sub("^.*/rurl_(.*)[.]tar[.]gz$", "\\1", rownames(archive[["rurl"]]))
      } else character(0)
      published <- c(current, archived)
      if (!version %in% published) {
        stop(sprintf(paste0("DESCRIPTION declares a rurl floor of %s, but CRAN has never published it.\n",
                            "The declared minimum names a version nobody can install. CRAN carries: %s."),
                     version, paste(sort(published), collapse = ", ")), call. = FALSE)
      }
      writeLines(sprintf("export FLOOR=%s", version), "floor.env")
      cat(sprintf("DESCRIPTION declares rurl (>= %s); CRAN has published it. Testing against %s.\n",
                  version, version))'
    - . ./floor.env
    # Pinned to the exact floor, into a job-local library. `install_version`
    # reaches the CRAN archive, so a superseded floor still installs.
    - |
      Rscript -e '
      lib <- Sys.getenv("RURL_FLOOR_LIB")
      dir.create(lib, recursive = TRUE, showWarnings = FALSE)
      floor <- Sys.getenv("FLOOR")
      remotes::install_version("rurl", version = sprintf("== %s", floor), lib = lib,
                               repos = "https://cloud.r-project.org",
                               dependencies = FALSE, upgrade = "never")
      installed <- as.character(packageVersion("rurl", lib.loc = lib))
      if (!identical(installed, floor)) {
        stop(sprintf("Installed rurl %s, but DESCRIPTION declares the floor as %s.",
                     installed, floor), call. = FALSE)
      }'
    - |
      R_LIBS="$RURL_FLOOR_LIB:$R_LIBS_USER" Rscript -e '
      in_use <- as.character(packageVersion("rurl"))
      if (!identical(in_use, Sys.getenv("FLOOR"))) {
        stop(sprintf("Suite would run against rurl %s, not the declared floor %s.",
                     in_use, Sys.getenv("FLOOR")), call. = FALSE)
      }
      cat("Running the suite against rurl", in_use, "\n")
      testthat::test_local(".", stop_on_failure = TRUE)'

# The docs site. Must be named `pages` and publish `public/` — that pairing is
# what GitLab Pages deploys, not a convention this file chose.
#
# Default branch only: a site rebuilt from every merge request would publish
# unreviewed docs to the same URL.
pages:
  stage: deploy
  needs: [check]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends pandoc
    - Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pkg_install("pkgdown")'
    # pagerankr itself must be INSTALLED, not merely loaded: `build_reference()`
    # evaluates the examples, and those call `library(pagerankr)`. Building with
    # `install = FALSE` and no installed copy fails at the first example with
    # "there is no package called 'pagerankr'". The GitHub workflow got this for
    # free from `extra-packages: local::.`; on GitLab it has to be explicit.
    - Rscript -e 'pak::local_install(upgrade = FALSE)'
    # pkgdown renders EVERY top-level .md into the site --
    # `pkgdown:::package_mds()` hardcodes its own skip list (README/NEWS/
    # LICENSE) and _pkgdown.yml cannot override it -- so the agent
    # instruction files were being published as AGENTS.html, CLAUDE.html and
    # friends next to the reference: internal working notes served as if
    # they were user documentation, and indexable (SEOR-pibdjanz).
    #
    # A glob naming the PRIVATE families (`AGENTS*.md CLAUDE*.md FP_*.md`)
    # used to live here. It is fail-OPEN: a family it does not name --
    # GEMINI.md, CODEX.md, anything not yet invented -- is published by
    # default until someone notices and extends the glob. That is exactly
    # how the leak reached four repos after being fixed in one, because the
    # exact names differ per repo and the explicit list was copied rather
    # than re-derived (SEOR-wqxhftpv).
    #
    # Inverted to a KEEP-list: name what is meant for the site, move
    # everything else. An unknown file then stays private by default. `mv`,
    # not `rm -f` -- deleting the source before `build_site` still leaves
    # pkgdown's search.json pointing at a page that then 404s; moving it out
    # first means pkgdown never sees it at all (matches pslr's `pages` job,
    # see the comment above its own `mv ... /tmp/agent-md/`). The scratch
    # dir is on the CI runner's disposable filesystem, outside the checkout
    # that becomes `public/`, and the CI checkout is disposable, so nothing
    # is restored after.
    #
    # The `for f in $keep` loop deliberately fails the job if one of these
    # named files is missing: the list is a claim about which docs this repo
    # publishes, and a silently-missing one would mean the site quietly lost
    # a page rather than the build failing loudly. THIRD_PARTY_NOTICES.md is
    # the one exception -- not every repo carries it -- so its absence is a
    # no-op rather than a failure.
    - |
      set -eu
      keep="README.md NEWS.md LICENSE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md THIRD_PARTY_NOTICES.md ACKNOWLEDGMENTS.md"
      for f in $keep; do
        if [ "$f" = "THIRD_PARTY_NOTICES.md" ] && [ ! -f "$f" ]; then
          continue
        fi
        if [ ! -f "$f" ]; then
          echo "Expected public doc '$f' is missing; the pkgdown md keep-list no longer describes this repo (SEOR-wqxhftpv)." >&2
          exit 1
        fi
      done
      mkdir -p /tmp/agent-md
      for f in *.md; do
        case " $keep " in
          *" $f "*) ;;
          *) mv "$f" /tmp/agent-md/ ;;
        esac
      done
    - Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'
    - mv docs public
  artifacts:
    paths:
      - public
