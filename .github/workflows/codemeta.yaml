# Keeps codemeta.json in step with DESCRIPTION, and commits the result without
# review. That last part is why the repair step below exists rather than a note
# in CONTRIBUTING.md: there is no human between `write_codemeta()` and `main`,
# so anything the generator gets wrong lands unread.
on:
  push:
    branches: [main]
    paths:
      - DESCRIPTION
      - inst/CITATION
      - .github/workflows/codemeta.yaml
  workflow_dispatch:

name: codemeta

permissions:
  contents: write

jobs:
  codemeta:
    runs-on: ubuntu-latest
    concurrency:
      group: codemeta-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::codemetar

      - name: Regenerate codemeta.json
        run: codemetar::write_codemeta(".")
        shell: Rscript {0}

      # `write_codemeta()` builds a Remotes-sourced dependency's `sameAs` by
      # prepending https://github.com/ to the raw spec, without parsing the
      # `host::` prefix that remotes and pak both define. With
      # `Remotes: gitlab::bart-turczynski/rurl` it emits
      # https://github.com/gitlab::bart-turczynski/rurl — wrong host, and a
      # literal `::` in the path (PAGE-bpwkoofa).
      - name: Repair host-prefixed Remotes URLs
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")
          bases <- c(github = "https://github.com",
                     gitlab = "https://gitlab.com")
          json <- readLines("codemeta.json", warn = FALSE)
          if ("Remotes" %in% colnames(desc)) {
            specs <- trimws(strsplit(desc[1L, "Remotes"], ",")[[1L]])
            for (spec in specs[nzchar(specs)]) {
              # A bare `owner/repo` means GitHub by remotes' own default, which
              # is exactly what codemetar already assumed. Only a prefixed spec
              # is mangled, so leave the rest alone.
              if (!grepl("::", spec, fixed = TRUE)) next
              host <- tolower(sub("::.*$", "", spec))
              if (!host %in% names(bases)) {
                stop("Unsupported `Remotes:` host prefix '", host,
                     "'; this step knows ",
                     paste(names(bases), collapse = ", "), ".", call. = FALSE)
              }
              repo <- sub("@.*$", "", sub("^[[:alpha:]]+::", "", spec))
              json <- gsub(paste0("https://github.com/", spec),
                           paste0(bases[[host]], "/", repo),
                           json, fixed = TRUE)
            }
            writeLines(json, "codemeta.json")
          }
          # Rewriting the declared specs only covers mangling we have already
          # seen. Nothing with a remote spec left inside a URL reaches the
          # commit step below, whatever produced it.
          bad <- grep("https?://[^\"]*::", json, value = TRUE)
          if (length(bad)) {
            stop("codemeta.json still carries a remote spec inside a URL:\n",
                 paste(trimws(bad), collapse = "\n"), call. = FALSE)
          }

      - name: Commit codemeta.json if changed
        run: |
          if [ -n "$(git status --porcelain codemeta.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add codemeta.json
            git commit -m "chore: refresh codemeta.json [skip ci]"
            git push
          else
            echo "codemeta.json unchanged."
          fi
