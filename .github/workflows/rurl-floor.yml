# Exercises the `rurl` lower bound that DESCRIPTION declares.
#
# Every other workflow resolves `Remotes: bart-turczynski/rurl` to main HEAD, so
# nothing here has ever installed the version `Imports:` actually requires. That
# gap is how `rurl (>= 2.1.0)` survived unnoticed while no `v2.1.0` tag existed
# (PAGE-tsbkxhoz): the floor was a number someone reasoned to, not a release
# anything was tested against. Correcting it to `>= 2.2.0` fixed the number and
# left the gap, so this job closes the gap instead.
#
# It is ADDITIVE on purpose. The routine workflows must keep resolving main
# HEAD, because that continuous main-versus-pagerankr revdep coverage is relied
# on deliberately (PAGE-fjqyruaf). Nothing here touches the shared library: the
# floor is installed into a job-local directory and prepended for the test run
# only, so the dependency cache the other workflows share still holds main HEAD.
name: rurl floor

on:
  workflow_dispatch:
  # The floor can only go wrong two ways: the declaration changes, or upstream's
  # release history does. The path filter catches the first at the moment it is
  # proposed; the schedule catches the second.
  pull_request:
    paths: ['DESCRIPTION']
  schedule:
    - cron: '17 5 1 * *'  # 1st of the month, 05:17 UTC

permissions: read-all

concurrency:
  group: rurl-floor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    runs-on: ubuntu-latest
    name: Suite against the declared rurl floor
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RURL_FLOOR_LIB: ${{ github.workspace }}/.rurl-floor-lib
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Resolves and installs everything the normal way, main-HEAD rurl
      # included. The floor is layered over that below, so the suite runs with
      # the same dependency set as every other job apart from rurl itself.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes, any::testthat, any::pkgload
          needs: check

      - name: Resolve the declared floor
        id: floor
        shell: Rscript {0}
        run: |
          d <- read.dcf("DESCRIPTION")
          imports <- trimws(strsplit(d[1L, "Imports"], ",")[[1L]])
          hit <- grep("^rurl\\b", imports, value = TRUE)
          if (length(hit) != 1L) {
            stop("Expected exactly one `rurl` entry in Imports, found ",
                 length(hit), ".", call. = FALSE)
          }
          version <- sub("^rurl[[:space:]]*\\([[:space:]]*>=[[:space:]]*([^)[:space:]]+)[[:space:]]*\\)$",
                         "\\1", hit)
          if (identical(version, hit)) {
            stop("`rurl` is declared in Imports without a `(>= x.y.z)` floor: ",
                 hit, call. = FALSE)
          }
          # Take the source repo from `Remotes:` rather than hardcoding it, so a
          # move upstream cannot leave this job testing the wrong fork.
          remotes <- trimws(strsplit(d[1L, "Remotes"], ",")[[1L]])
          repo <- grep("rurl", remotes, value = TRUE)
          if (length(repo) != 1L) {
            stop("Expected exactly one `rurl` entry in Remotes, found ",
                 length(repo), ".", call. = FALSE)
          }
          repo <- sub("@.*$", "", sub("^[[:alpha:]]+::", "", repo))
          cat(sprintf("floor=%s\nrepo=%s\ntag=v%s\n", version, repo, version),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(sprintf("DESCRIPTION declares %s (>= %s); testing against tag v%s.\n",
                      repo, version, version))

      # The failure this repo actually shipped: a floor naming a version that
      # was never released. Checked separately from the install so the error
      # says that, rather than surfacing as an opaque install failure.
      - name: Verify the floor names a tag that exists
        env:
          REPO: ${{ steps.floor.outputs.repo }}
          TAG: ${{ steps.floor.outputs.tag }}
        run: |
          set +e
          git ls-remote --exit-code --tags \
            "https://github.com/${REPO}.git" "refs/tags/${TAG}" >/dev/null
          status=$?
          set -e
          # `--exit-code` reserves 2 for "queried fine, no such ref". Anything
          # else is the query itself failing, which must not be reported as a
          # missing tag — that is the one conclusion this job exists to draw.
          case "$status" in
            0) ;;
            2)
              echo "::error::DESCRIPTION declares a rurl floor of ${TAG#v}, but ${REPO} has no ${TAG} tag."
              echo "The declared minimum names a version nobody can install. Set the floor to a released tag."
              exit 1
              ;;
            *)
              echo "::error::Could not query tags on ${REPO} (git exit ${status}); the floor was not checked."
              exit "$status"
              ;;
          esac

      - name: Install rurl at the declared floor
        shell: Rscript {0}
        env:
          REPO: ${{ steps.floor.outputs.repo }}
          TAG: ${{ steps.floor.outputs.tag }}
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          lib <- Sys.getenv("RURL_FLOOR_LIB")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          remotes::install_github(
            Sys.getenv("REPO"),
            ref = Sys.getenv("TAG"),
            lib = lib,
            dependencies = FALSE,
            upgrade = "never",
            force = TRUE
          )
          installed <- as.character(packageVersion("rurl", lib.loc = lib))
          floor <- Sys.getenv("FLOOR")
          if (!identical(installed, floor)) {
            stop(sprintf(
              "Tag %s installs rurl %s, but DESCRIPTION declares the floor as %s.",
              Sys.getenv("TAG"), installed, floor
            ), call. = FALSE)
          }

      - name: Run the suite against the floor
        shell: Rscript {0}
        env:
          # Prepended for this step only. Everything else still resolves from
          # the shared library, so this swaps rurl and nothing more.
          R_LIBS: ${{ github.workspace }}/.rurl-floor-lib
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          in_use <- as.character(packageVersion("rurl"))
          if (!identical(in_use, Sys.getenv("FLOOR"))) {
            stop(sprintf(
              "Suite would run against rurl %s, not the declared floor %s.",
              in_use, Sys.getenv("FLOOR")
            ), call. = FALSE)
          }
          cat("Running the suite against rurl", in_use, "\n")
          testthat::test_local(".", stop_on_failure = TRUE)
